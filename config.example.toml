[fuente]
tipo = "excel"
ruta = "C:/consultor_judicial/entrada/extracto_procesos.xlsx"
hoja = "GENERAL"
col_radicado = "Radicado"
col_empresa = "Empresa"
col_despacho = "Despacho"
col_calidad = "Calidad"
col_estado = "Estado"
estados_incluidos = []

[salida]
base_datos = "datos/consultor.db"
carpeta_reportes = "reportes"
validador = "Alisson Rengifo"

[portal]
pausa_segundos = 1.0
reintentos = 3
espera_segundos = 2.0
timeout_segundos = 30
max_fallas_ciclo = 0.5
pausa_peticiones_segundos = 1.5
consultar_detalle = false
reintentos_bloqueo = 3
espera_bloqueo_segundos = 60

[primera_consulta]
# En la primera consulta de un radicado, lo registrado en los últimos N días sale como
# POSIBLE NOVEDAD; lo anterior queda como referencia. 0 = todo es referencia, sin alertas.
alertar_ultimos_dias = 7

[ejecucion]
min_minutos_entre_ciclos = 30

[mantenimiento]
archivar_reportes_tras_dias = 14
borrar_archivo_tras_dias = 0
respaldo_cada_dias = 7
respaldos_a_conservar = 8
carpeta_respaldo = ""

[alertas]
# Regla de puesta al día: apagada. Se enciende cuando lo indique la Gerencia Jurídica.
# Encendida, si las alertas anteriores sin decidir (detectadas hace más de dias_corte_regla días)
# pasan de umbral_anteriores, la ventana no se cierra hasta dejarlas en menos de objetivo_anteriores.
exigir_puesta_al_dia = false
umbral_anteriores = 30
objetivo_anteriores = 10
dias_corte_regla = 7
